name: Bug report
description: Something in the module does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        **Do not report security vulnerabilities here.** See
        [SECURITY.md](https://github.com/vocdoni/decidim-elections-vocdoni/blob/main/SECURITY.md).

  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what you got instead.
    validations:
      required: true

  - type: textarea
    id: reproduce
    attributes:
      label: How to reproduce
      description: The smallest sequence of steps that shows the problem.
      placeholder: |
        1. As an admin, …
        2. As a voter, open …
        3. …
    validations:
      required: true

  - type: input
    id: module-version
    attributes:
      label: decidim-elections-vocdoni version
      placeholder: "0.1.0"
    validations:
      required: true

  - type: input
    id: decidim-version
    attributes:
      label: Decidim version
      placeholder: "0.33.0"
    validations:
      required: true

  - type: dropdown
    id: side
    attributes:
      label: Where does it happen
      options:
        - Admin (setting up an election)
        - Public election page
        - Voting page
        - Background jobs / results sync
        - Installation or boot
        - Somewhere else
    validations:
      required: true

  - type: input
    id: api
    attributes:
      label: Vocdoni API the instance is configured against
      description: The host only, never the key.
      placeholder: "saas-api.vocdoni.net"

  - type: textarea
    id: logs
    attributes:
      label: Logs, stack traces or browser console output
      description: >-
        Redact anything identifying a voter. Never paste an API key, an auth
        token or a one-time code.
      render: text
