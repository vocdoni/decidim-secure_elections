<!DOCTYPE html>
<!--
  The old address of the voting page, kept as a redirect.

  This file exists for one reason and no other: the voting page used to be
  served at `/vocdoni/booth.html`, and links to that address were sent to real
  voters before it was renamed. Those links have to keep working, so this stub
  forwards them — query string and fragment included, since that is where the
  election actually travels — to `vote.html` beside it.

  Nothing new should ever point here. It is copied verbatim to
  `public/vocdoni/booth.html` by `npm run build:vote`.

  `location.replace` rather than `location.href` so the dead address does not
  end up in the voter's history and swallow their Back button. There is no
  `<meta http-equiv="refresh">` fallback because a meta refresh cannot carry the
  query string, and forwarding to the voting page without the election it names
  would land the voter on "this voting link is incomplete" — worse than the
  message below, which at least says what happened.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="noindex, nofollow">
    <!-- The query string names an election. Do not leak it to third parties. -->
    <meta name="referrer" content="no-referrer">
    <title>Vote</title>
    <script>
      window.location.replace("vote.html" + window.location.search + window.location.hash);
    </script>
  </head>

  <body>
    <noscript>
      <p>
        Your ballot is encrypted and signed in your browser, so voting needs
        JavaScript to work. Please enable JavaScript and reload this page.
      </p>
    </noscript>
  </body>
</html>
