<!DOCTYPE html>
<!--
  The voting page.

  This file is copied verbatim to `public/vocdoni/vote.html` by
  `npm run build:vote` and served straight off disk by the engine's static
  middleware. It is opened as:

    /vocdoni/vote.html?api=<apiUrl>&process=<processId>[&locale=xx][&exit=/path]

  Nothing is rendered into it and nothing is injected into it: `vote.js` reads
  that query string, fetches the *public* process from the Vocdoni API and
  builds the rest. There is no server behind this page.

  The shape is Decidim's own: a thin bar across the top, then one 42rem column
  holding the election title, the trail and the current step. A voter arrives
  here from a Decidim election page and should not feel they have left the site.

  What lives here rather than in JavaScript, and why:

    * the `aria-live` status region, because a live region has to exist in the
      document before it is written to for the update to be announced;
    * the theme toggle, because it must work on the two failure screens below —
      which are the screens a voter is most likely to be reading in the dark —
      and those are reached without any of the voting page's own machinery;
    * the two "could not start" messages and the `<noscript>`, because they
      have to work when no translation file could be fetched and when no script
      ran at all. They are in English on purpose: they are the floor, not the
      norm.

  There are two of them because the two failures have opposite answers. A page
  whose translations would not load may well work on the next attempt, so
  reloading is the right advice. A link that arrived without the election it
  names will arrive without it every time it is opened, and telling that voter
  to reload is telling them to do the one thing that cannot possibly help.

  `lang` and `dir` are corrected by `vote.js` once the locale is negotiated, and
  so is the theme toggle's label. Its English floor is here for the same reason
  the messages below are.
-->
<html lang="en" dir="ltr">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <!-- A voting page is for one voter and one election; there is nothing to index. -->
    <meta name="robots" content="noindex, nofollow">
    <!-- The query string names an election. Do not leak it to third parties. -->
    <meta name="referrer" content="no-referrer">
    <title>Vote</title>
    <link rel="stylesheet" href="vote.css">
    <!--
      The two weights the first screen needs, fetched alongside the stylesheet
      rather than after it. Both are served from this gem: a voting page must
      not tell a third-party font host that somebody is voting.
    -->
    <link rel="preload" href="fonts/source-sans-pro-regular.woff2" as="font" type="font/woff2" crossorigin>
    <link rel="preload" href="fonts/source-sans-pro-600.woff2" as="font" type="font/woff2" crossorigin>
    <script src="vote.js" defer></script>
  </head>

  <body class="vocdoni-body">
    <a class="vocdoni-skip" href="#js-vocdoni-vote">Skip to the ballot</a>

    <div class="vocdoni-topbar">
      <div class="vocdoni-topbar__inner">
        <!--
          The way back out, filled in only when the link that opened this page
          carried one. A dead link is worse than no link.
        -->
        <p id="js-vocdoni-election-exit" class="vocdoni-topbar__exit"></p>
        <!--
          `aria-pressed` is what announces the state; the switch beside the
          label is drawn in CSS and says nothing. The choice is held in memory
          for the life of the page and written nowhere — ARCHITECTURE §0.
        -->
        <button type="button" id="js-vocdoni-theme" class="vocdoni-theme" aria-pressed="false">
          <span id="js-vocdoni-theme-label">Dark theme</span>
          <span class="vocdoni-theme__switch" aria-hidden="true"></span>
        </button>
      </div>
    </div>

    <main class="vocdoni-main">
      <!-- The election, named the way Decidim names a page: one `h1`, one decorator. -->
      <h1 id="js-vocdoni-election-title" class="vocdoni-title"></h1>

      <noscript>
        <div class="vocdoni-alert">
          <p>
            Your ballot is encrypted and signed in your browser, so this page
            needs JavaScript to work. Please enable JavaScript and reload it.
          </p>
        </div>
      </noscript>

      <div id="js-vocdoni-vote-unavailable" class="vocdoni-alert" hidden>
        <p>
          This page could not start. Please reload it, and contact the organisers
          if it keeps happening.
        </p>
      </div>

      <div id="js-vocdoni-vote-incomplete" class="vocdoni-alert" hidden>
        <p>
          This voting link is incomplete, so we do not know which election to
          open. Reloading the page will not fix it — please ask the organisers
          for a new link.
        </p>
      </div>

      <!-- The single polite live region for every status change in the flow. -->
      <p id="js-vocdoni-vote-status" class="vocdoni-status" role="status" aria-live="polite" aria-atomic="true"></p>

      <div id="js-vocdoni-vote" class="vocdoni-vote"></div>
    </main>
  </body>
</html>
