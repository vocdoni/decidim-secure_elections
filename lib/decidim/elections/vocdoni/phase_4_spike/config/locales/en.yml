en:
  decidim:
    admin:
      menu:
        # Injected into upstream's `admin_elections_menu` from the
        # phase-4 spike engine. Appears on every election so an admin can
        # discover the Vocdoni opt-in on the Security tab.
        elections_menu:
          security: "Security"
    elections:
      vocdoni:
        admin:
          # The Security tab. Written for the person running the vote, not for
          # engineers: no "blockchain", "CSP", "OTP" or "manifest". The two
          # vote types are "Poll without guarantees" (any standard Decidim
          # census) and "Vote with guarantees" (`enable_vocdoni`, the Vocdoni
          # opt-in). Running prose uses those short forms; the cards carry the
          # full titles.
          security:
            show:
              title: "Security"
              choice:
                legend: "How do you want to run this vote?"
                lead: "This choice decides who can read the ballots and whether the count can be checked by someone other than you."
                recommended: "Recommended for binding decisions"
                best_for: "Best for:"
                selected: "Selected"
                simple:
                  title: "Poll without guarantees"
                  summary: "Runs on this platform, like a survey. Not anonymous, and nobody outside can check the count, so it does not meet what annual general meetings, board elections and other statutory decisions normally require."
                  points:
                    stored: "Ballots are stored in this platform's database."
                    readable: "Platform administrators can technically read them."
                    unverifiable: "Results are computed by this server; nobody outside can check them."
                    editable: "Can be edited until the vote starts."
                  best_for: "Informal polls, quick consultations, decisions nobody is likely to contest."
                secure:
                  title: "Vote with guarantees"
                  summary: "Anonymous and verifiable: ballots are sealed so nobody can read them, and anyone can check the count independently. This is what statutes and regulations normally require of a binding vote."
                  points:
                    anonymous: "Nobody, not even administrators, can link a ballot to a voter."
                    tamper: "Any tampering is detectable: each voter gets a receipt they can check on a public website, and the results export links there too."
                    minimal: "Only the details needed to check who may vote are used; ballots hold no personal data."
                  best_for: "Elections of officers, statutory votes, budgets: anything that must stand up to challenge."
                  powered_by: "Powered by the Vocdoni voting protocol."
                  # Leave empty until the admin guide exists: the link is only
                  # rendered when this has a value.
                  guide_url: ""
                  guide_link: "Read the full guide"
                refused_identifiers: "Your list identifies people only by an access code, which a vote with guarantees cannot check. Add another detail on the Census tab to run this as a vote with guarantees."
                good_to_know_html: "<strong>Good to know:</strong> you can change this choice until the election is published. Voters won't notice any difference, except the one-time code if you enable it."
              why:
                title: "Why organizing a verifiable secure vote matters for organisations and public bodies"
                secrecy:
                  title: "Ballot secrecy and anonymity"
                  body: "A secret ballot is the baseline of a legitimate vote. In a vote with guarantees it rests on cryptography, not on trust in whoever runs the platform."
                leaks:
                  title: "Fewer leaks, less liability"
                  body: "The platform never holds a readable ballot, so a data breach or a mistaken administrator cannot reveal how anyone voted."
                gdpr:
                  title: "GDPR and data minimisation"
                  body: "How someone voted is sensitive personal data. In a vote with guarantees, the platform never stores it, so there is far less to protect and ballots contain no personal data. Only the identifiers needed to check who may vote are processed."
                statutes:
                  title: "Regulation and your own statutes"
                  body: "Beyond national law, the statutes and bylaws of associations, cooperatives, professional bodies and councils often require a secret ballot for elections and binding decisions. This option lets you guarantee it, and prove it."
                table:
                  title: "At a glance"
                  caption: "Comparison between a poll without guarantees and a vote with guarantees"
                  feature: "Feature"
                  # Short forms of the two card titles. A column heading and a
                  # stacked row's label have no room for the full one.
                  simple_heading: "Without guarantees"
                  secure_heading: "With guarantees"
                  "yes": "Yes"
                  "no": "No"
                  rows:
                    secrecy:
                      label: "Ballot secrecy"
                      simple: "Relies on administrators"
                      secure: "Guaranteed"
                    readers:
                      label: "Who can read ballots"
                      simple: "Platform administrators"
                      secure: "Nobody"
                    tamper:
                      label: "Tampering is detectable"
                    verification:
                      label: "Anyone can verify the count"
                    personal_data:
                      label: "Personal data kept with the ballot"
                      simple: "A reference to the voter"
                      secure: "None"
                    locked:
                      label: "Locked once published"
              # Shown, not chosen: the details belong to the census, so they
              # are picked on the Census tab and only reported here.
              identifiers:
                legend: "How people prove who they are"
                chosen: "Voters type their %{fields} to be found on your list."
                change_html: "You choose these together with your list, on the <a href=\"%{url}\">Census tab</a>."
                by_code: "In a vote with guarantees their %{fields} is not checked against the list: a one-time code is sent there instead, and that is what proves them (see below)."
                refused:
                  title: "A vote with guarantees can't use these details"
                  body: "Your list identifies people only by an access code, which a vote with guarantees can neither check nor send a code to. On the Census tab, add a member number, ID number, name, date of birth, email address or phone number."
                none_html: "Nobody can vote yet: choose on the <a href=\"%{url}\">Census tab</a> which details people type to be found on your list."
                no_census_html: "Choose who can vote on the <a href=\"%{url}\">Census tab</a> first."
                registered:
                  lead: "Your census is made of people registered on this platform."
                  simple: "They vote while signed in to their account; nothing else is asked."
                  secure: "In the voting booth they type their participant number, which we show them when they open the vote while signed in."
              two_factor:
                legend: "Confirm voters' identity with a one-time code"
                lead: "Each voter receives a one-time code when they open the ballot and types it in before voting. It stops someone voting on behalf of another person and makes the result harder to dispute."
                simple_note: "Available for votes with guarantees."
                email:
                  label: "Email code"
                  help: "The code goes to each person's email address."
                  required: "Your list identifies people by their email address, so this code is how they prove who they are. It is always on."
                  needs_column: "Your list has no email column, so there is nowhere to send this code."
                  not_for_registered: "Not available."
                sms:
                  label: "SMS code"
                  help: "The code goes by text message to each person's phone number."
                  required: "Your list identifies people by their phone number, so this code is how they prove who they are. It is always on."
                  needs_column: "Your list has no phone column, so there is nowhere to send this code."
                  not_for_registered: "Registered participants have no phone number on this platform, so this code can't be sent."
                both_note: "If both are on, each voter chooses how to receive the code."
              validation:
                legend: "Check with the secure voting service"
                details: "Technical details"
                pending:
                  title: "Checking your list…"
                  body: "We're sending your list to the secure voting service to make sure everyone can vote with the details you chose. This usually takes less than a minute."
                  refresh: "Refresh"
                  stale: "This is taking longer than expected. Save the Security tab again to retry; if it keeps happening, contact support."
                ok:
                  title:
                    one: "Your list is ready: 1 person can vote."
                    other: "Your list is ready: %{count} people can vote."
                  body: "Everyone can be told apart with the details you chose. You can publish the election."
                failed:
                  title: "Your list isn't ready for a vote with guarantees yet"
                  generic: "The secure voting service couldn't accept this list. Its own words are under \"Technical details\" below. For a large list the usual cause is your Vocdoni plan, which limits how many people your organisation can hold across all its elections, not just this one; Vocdoni can raise it for you."
                  codes:
                    roster_over_ceiling: "This list is larger than this platform sends in one go (%{limit} people). That limit is this platform's own, not your Vocdoni plan's. Ask whoever runs this platform to raise it, or run this as a poll without guarantees."
                    no_identifiers: "Choose above which details people type to vote."
                    no_identity: "Some people have no member number, ID number, email or phone. The secure voting service needs at least one of them for every person: add one of those columns to your file."
                  problems:
                    duplicates:
                      one: "1 person can't be told apart from another with the details you chose."
                      other: "%{count} people can't be told apart from others with the details you chose."
                    missing_data:
                      one: "1 person is missing one of the details you chose."
                      other: "%{count} people are missing one of the details you chose."
                    not_found:
                      one: "1 person couldn't be found in the secure voting service."
                      other: "%{count} people couldn't be found in the secure voting service."
                publish_failed:
                  title: "Publishing to the secure voting service failed"
                  body: "The election is published here, but the secure vote could not be set up. Contact support with the technical details below."
              summary:
                title: "Your configuration"
                levels:
                  basic: "Without guarantees"
                  strong: "With guarantees"
                  strongest: "With guarantees + one-time code"
                sentences:
                  basic: "Ballots are kept on this platform. Suitable for informal consultations."
                  strong: "Anonymous ballots, result checkable by anyone."
                  strongest: "Anonymous ballots, result checkable by anyone. Voters confirm their identity with a one-time code."
            update:
              success: "Security settings updated."
              success_checking: "Security settings updated. We're checking your list with the secure voting service; the result appears on the Security tab."
              invalid: "Security settings could not be saved. Please review the errors below."
        booth:
          launcher:
            help_html: "Your ballot is signed and submitted in your browser. The Decidim server never sees a vote."
            enter: "Open the voting booth"
            asked_for_html: "In the booth you will be asked for your <strong>%{details}</strong>, exactly as your organisation has them."
            participant_number_html: "In the booth you will be asked for your participant number: <strong>%{number}</strong>."
            sign_in_first: "Sign in first: the booth will ask for your participant number, which we show you here once you are signed in."
            chain_note_html: "Anchored on the Vocdoni chain <code>%{chain}</code>."
            not_ready: "This election is not yet ready to accept votes on the blockchain. Please try again in a few moments."
