en:
  decidim:
    admin:
      menu:
        # Injected into upstream's `admin_elections_menu` from the
        # phase-4 spike engine. Appears on every election so an admin can
        # discover the Vocdoni opt-in on the Security tab.
        elections_menu:
          security: "Security"
    elections:
      vocdoni:
        admin:
          security:
            show:
              title: "Security"
              enable_heading: "Vocdoni-backed secure voting"
              enable_help_html: >
                Route this election through the Vocdoni voting protocol so ballots
                are signed and submitted in the voter's browser and the tally is
                anchored on the Vocdoni blockchain.
              enable_label: "Enable Vocdoni secure voting for this election"
              two_fa_heading: "Second-factor authentication"
              two_fa_help_html: >
                Pick which one-time codes the Vocdoni CSP sends to each voter
                after they authenticate. Codes go to values already on file in the
                Vocdoni memberbase — voters do not type their address at auth
                time. Leave both unchecked to authenticate voters on credentials
                alone (weaker).
              sms_label: "SMS one-time code"
              sms_help: "Requires every voter to have a phone number on their memberbase entry."
              email_label: "Email one-time code"
              email_help: "Requires every voter to have an email address on their memberbase entry."
              both_note: "If both are checked, the voter picks which one to receive at authentication time."
            update:
              success: "Security settings updated."
              invalid: "Security settings could not be saved. Please review the errors below."
        booth:
          launcher:
            help_html: "Your ballot is signed and submitted in your browser. The Decidim server never sees a vote."
            enter: "Open the voting booth"
            chain_note_html: "Anchored on the Vocdoni chain <code>%{chain}</code>."
            not_ready: "This election is not yet ready to accept votes on the blockchain. Please try again in a few moments."
