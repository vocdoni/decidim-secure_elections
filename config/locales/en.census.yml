en:
  activemodel:
    attributes:
      census:
        credentials: Credentials
        members: People
        two_factor_method: Two-factor verification
        weighted: Voting power
      census_import:
        file: File
        replace: Replace the current census
      census_member:
        birth_date: Date of birth
        email: Email
        member_number: Member number
        name: First name
        national_id: National ID
        phone: Phone
        surname: Last name
        weight: Voting power
      census_verifications:
        authorization_handler: Verification
        replace: Replace the current census
    errors:
      models:
        census:
          attributes:
            credentials:
              census_identifies_nobody: Pick at least one credential, or turn on two-factor verification. A census with neither identifies nobody.
              inclusion: is not a member field that can be used as a credential
              too_many_credentials:
                one: Pick at most 1 credential.
                other: Pick at most %{count} credentials.
            members:
              duplicated_field: Two or more people share the same %{field}. The census matches voters on that value, so it has to be unique.
              # Produced by `Decidim::AttributeObject::NestedValidator` for any
              # invalid row. The members screen deliberately does not render it
              # — the flash carries the one verdict, and a second, softer
              # sentence next to it read as a partial save that never happens.
              invalid: Some of the people below still need fixing.
        census_import:
          attributes:
            file:
              malformed: could not be read as a CSV file
              no_known_columns: has no column this census recognises. Download the template to see the expected headers.
              not_csv: is not a CSV file. This census reads .csv files only — save your list as "CSV UTF-8 (Comma delimited)" and upload that.
              spreadsheet: is a spreadsheet, and only CSV files can be read here. Open it, choose "Save as" (or "Export"), pick "CSV UTF-8 (Comma delimited)", and upload the file that produces.
              too_large: is %{size}, and up to %{limit} can be imported at once. Even a census of 20,000 people is only a few megabytes, so this is probably not the file you meant; if it is, split it and import the parts one after another.
              unreadable: could not be read as text. It may be a renamed file of another kind; if it did come from a spreadsheet, open it again and save it as "CSV UTF-8 (Comma delimited)".
        census_member:
          # `blank`, `invalid` and `taken` override Rails defaults that leaked
          # into otherwise hand-written copy — "cannot be blank", "has already
          # been taken" — read out in a table of census rows where nothing
          # else says why the value is wanted. Keyed on the model rather than
          # per attribute, so one line covers every column.
          attributes:
            base:
              blank_member: This row is empty. Fill it in or remove it.
            email:
              invalid: does not look like an email address
          blank: is needed, because this election identifies voters by it
          invalid: does not look right
          taken: is already used by somebody else in this list, and the census has to tell them apart
  activerecord:
    errors:
      models:
        decidim/secure_elections/census_member:
          attributes:
            base:
              blank_member: A census entry needs at least one value.
