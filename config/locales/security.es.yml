es:
  decidim:
    admin:
      menu:
        elections_menu:
          security: "Seguridad"
    elections:
      vocdoni:
        admin:
          dashboard:
            security:
              title: "Tu configuración de seguridad"
            census_snapshot:
              title: "Censo para el voto secreto"
              empty: "El censo está vacío: el voto secreto no podrá empezar hasta que haya al menos un participante."
              count:
                one: "Ahora mismo hay 1 participante en el censo."
                other: "Ahora mismo hay %{count} participantes en el censo."
              late_joiners: "Decidim avala a cada participante cuando abre la cabina de votación, así que quienes entren en el censo después de que empiece la votación (por ejemplo, porque se verifican más tarde) también podrán votar, mientras no se alcance el máximo de votantes declarado."
              declared:
                one: "El máximo declarado es de 1 votante."
                other: "El máximo declarado es de %{count} votantes."
              projected:
                one: "Cuando empiece la votación, el máximo declarado será el tamaño del censo en ese momento más un 20 %, redondeado hacia arriba: con el censo actual, 1 votante."
                other: "Cuando empiece la votación, el máximo declarado será el tamaño del censo en ese momento más un 20 %, redondeado hacia arriba: con el censo actual, %{count} votantes."
            attestations:
              title: "Atestaciones"
              issued:
                one: "Emitida: 1 atestación a %{voters}."
                other: "Emitidas: %{count} atestaciones a %{voters}."
              voters:
                one: "1 votante"
                other: "%{count} votantes"
              published:
                one: "Publicado por Vocdoni: 1 votante firmado, de un máximo declarado de %{max}."
                other: "Publicados por Vocdoni: %{count} votantes firmados, de un máximo declarado de %{max}."
              unknown:
                one: "Votantes firmados que Decidim nunca atestó: 1."
                other: "Votantes firmados que Decidim nunca atestó: %{count}."
              per_question:
                one: "%{question}: 1 votante firmado."
                other: "%{question}: %{count} votantes firmados."
              unavailable:
                pending: "Vocdoni publica los votantes firmados cuando han terminado todas las preguntas."
                error: "Ahora mismo no se pueden leer los votantes firmados de Vocdoni."
          security:
            show:
              title: "Seguridad"
              choice:
                legend: "¿Cómo quieres llevar a cabo esta votación?"
                lead: "Esta elección determina quién puede leer las papeletas y si el recuento puede ser verificado por alguien ajeno a la organización."
                recommended: "Recomendado para decisiones vinculantes"
                best_for: "Ideal para:"
                simple:
                  title: "Voto simple"
                  points:
                    stored: "Las papeletas se guardan en la base de datos de esta plataforma."
                    readable: "Los administradores de la plataforma pueden leerlas técnicamente."
                    unverifiable: "Los resultados se calculan en este servidor; nadie externo puede comprobarlos."
                    editable: "Se puede modificar hasta que comience la votación."
                  best_for: "Encuestas informales, consultas rápidas, decisiones que es poco probable que se contesten."
                secure:
                  title: "Voto secreto y verificable"
                  points:
                    anonymous: "Nadie — ni siquiera los administradores — puede vincular una papeleta a un votante."
                    tamper: "Cualquier manipulación es detectable: cada votante recibe un justificante para comprobarlo en un explorador público, y la exportación de resultados hace referencia a él."
                    minimal: "Solo se utilizan los datos necesarios para verificar quién puede votar; las papeletas no contienen ningún dato personal."
                    locked: "Bloqueada una vez publicada — eso es lo que la hace fiable."
                  best_for: "Elecciones de cargos, votaciones estatutarias, presupuestos — cualquier cosa que deba resistir una impugnación."
                  powered_by: "Impulsado por el protocolo de votación Vocdoni."
                  guide_url: ""
                  guide_link: "Lee la guía completa"
                good_to_know_html: "<strong>Bueno saber:</strong> puedes cambiar esta elección hasta que empiece la votación. Las personas votantes no notarán ninguna diferencia, excepto el código de un solo uso si lo activas."
              two_factor:
                legend: "Confirma la identidad de los votantes con un código de un solo uso"
                lead: "Cada votante recibe un código de un solo uso cuando abre la papeleta y debe introducirlo antes de votar. Evita que alguien vote en nombre de otra persona y hace el resultado más difícil de impugnar."
                email:
                  label: "Código por correo electrónico"
                  help: "El código se envía a la dirección de correo electrónico con la que cada participante se ha registrado."
                sms:
                  label: "Código por SMS"
                  help: "El código se envía por mensaje de texto al número de teléfono de la verificación o de la fila del censo de cada participante, escrito con su prefijo internacional (por ejemplo, +34 600 123 456). Quien no tenga uno no podrá votar."
                one_channel_note: "Elige una opción: el código se envía por correo electrónico o por SMS."
                one_channel: "Elige el código por correo electrónico o el código por SMS, no ambos."
              summary:
                sentences:
                  basic: "Las papeletas se guardan en esta plataforma. Adecuado para consultas informales."
                  strong: "Papeletas anónimas, resultado verificable por cualquier persona."
                  strongest: "Papeletas anónimas, resultado verificable por cualquier persona. Los votantes confirman su identidad con un código de un solo uso."
            update:
              success: "Configuración de seguridad actualizada."
              invalid: "No se ha podido guardar la configuración de seguridad. Revisa los errores que aparecen a continuación."
