              relay_rejected: La xarxa de votació ha rebutjat aquest vot. No s'ha comptat.
              relay_unconfirmed: Hem perdut la connexió mentre s'enviava el teu vot. Pot ser que s'hagi comptat igualment — no votes de nou fins que ho hagis comprovat.
              sign_rejected: El cens no ha autoritzat aquest vot. Pot ser que ja s'hagi emès des d'un altre dispositiu.
