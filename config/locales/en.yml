          form:
            auth_fields_help: Voters will be asked for these fields to prove they belong to the census. At least one is required.
            auth_fields_legend: Authentication fields
            auth_title: Voter authentication
            group_help: The identifier of the member group in your Vocdoni organization whose members may vote. Only members of this group will be admitted.
            group_title: Member group
            size_help: Used to display turnout. It is refreshed automatically once the election is on the blockchain.
            two_fa_help: If you pick any of these, voters receive a one-time code and have to enter it before voting. Leave empty for authentication only.
            two_fa_legend: Two-factor verification
          not_configured: Not configured
          show:
            title: Census
          update:
            invalid: There was a problem saving the census.
            success: Census saved successfully.
        elections:
          actions_title: Actions
          cancel: Cancel
          confirm_trash:
