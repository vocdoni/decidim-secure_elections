en:
  activemodel:
    attributes:
      answer:
        title: Answer
      census:
        census_auth_fields: Authentication fields
        census_group_id: Member group ID
        census_size: Expected number of eligible voters
        census_two_fa_fields: Two-factor fields
      election:
        description: Description
        end_time: End date and time
        question_type: Question type
        questions: Questions
        result_visibility: Result visibility
        start_immediately: Start immediately
        start_time: Start date and time
        stream_uri: Live streaming video
        title: Title
      question:
        answers: Options
        description: Description
        max_choices: Maximum number of choices
        min_choices: Minimum number of choices
        question_type: Question type
        secret_until_the_end: Keep the ballots encrypted until the election ends
        title: Question
      question_status:
        status: Status
      setup:
        confirm_irreversible: I understand this cannot be undone
    errors:
      models:
        census_verifications:
          attributes:
            authorization_handler:
              # Submitting the panel with nothing chosen fell through to
              # Decidim's generic "There is an error in this field", which is
              # the one message on this form that names neither the field nor
              # what to do about it.
              blank: Choose the verification to import from. Everybody who has been granted it joins the census.
              # Rendered next to the field by `error_for`, which prints the
              # message and nothing else — so it has to be a whole sentence, not
              # the fragment an ActiveModel message usually is.
              granted_to_nobody: This verification has not been granted to anybody yet, so it would add no one to the census. Choose another verification, or add people by hand.
              # Only reachable by tampering with the select, but it is rendered
              # the same way, so it is a whole sentence for the same reason.
              inclusion: This is not a verification this organization offers. Choose one from the list.
        election:
          attributes:
            end_time:
              not_in_the_future: must be in the future — it is now %{now} in the organization time zone
            questions:
              blank: 'Add at least one question: an election with nothing on the ballot has nothing to vote on.'
            start_time:
              not_before_end_time: must be before the end of voting, %{end_time}
              not_in_the_future: must be in the future — it is now %{now} in the organization time zone. A start in the past is not refused by the voting network, it is silently moved to the moment the election is published, so this election would open immediately and show a start time it never had. Tick "Start immediately" if that is what you meant.
        question:
          attributes:
            answers:
              duplicated: 'Two of these options say the same thing: a voter cannot tell them apart on the ballot, and the results would show them as two identical rows. Reword one of them, or remove it. Options in different questions may repeat.'
              too_short: 'Add at least %{count} options: a question with a single option is not a choice.'
            max_choices:
              greater_than: A voter has to be allowed at least one option. Set this to 1 or more, or leave it empty for no upper limit.
              less_than_min: The maximum cannot be lower than the minimum, which is %{min}. Raise this number, or lower the minimum.
              more_than_options: This question offers %{count} options, so nobody can pick more than %{count}. Lower this number, or add more options.
            min_choices:
              greater_than: A voter has to be asked for at least one option. Set this to 1 or more, or leave it empty for no lower limit.
              more_than_max: The minimum cannot be higher than the maximum, which is %{max}. Lower this number, or raise the maximum.
              more_than_options: This question offers %{count} options, so nobody can be asked to pick more than %{count}. Lower this number, or add more options.
  activerecord:
    models:
      decidim/secure_elections/answer:
        one: Answer
        other: Answers
      decidim/secure_elections/election:
        one: Election
        other: Elections
      decidim/secure_elections/question:
        one: Question
        other: Questions
  decidim:
    admin:
      filters:
        search_placeholder:
          search_text_cont: Search %{collection} by title or description
        vocdoni:
          published_at_null:
            label: Public site
            values:
              'false': Shown on the public site
              'true': Not on the public site
          with_any_state:
            label: State
            values:
              finished: Finished
              ongoing: Ongoing
              upcoming: Upcoming
    components:
      vocdoni:
        actions:
          vote: Vote
        name: Secure elections
        settings:
          global:
            announcement: Announcement
          step:
            announcement: Announcement
    events:
      secure_elections:
        election_published:
          button_text: Vote now
          email_intro: |-
            Hi,
            The election "%{resource_title}" is open for voting in %{participatory_space_title}. Your ballot is encrypted and signed in your browser, and this website never sees how you voted.
          email_outro: You have received this notification because you are following %{participatory_space_title}. You can stop receiving notifications following the previous link.
          email_subject: Voting is open in "%{resource_title}"
          notification_title: The <a href="%{resource_path}">%{resource_title}</a> election is open for voting in <a href="%{participatory_space_url}">%{participatory_space_title}</a>.
        election_results_published:
          button_text: See the results
          email_intro: |-
            Hi,
            Voting has ended in "%{resource_title}" and the results are available. Every result can be checked independently on the Vocdoni explorer.
          email_outro: You have received this notification because you are following %{participatory_space_title}. You can stop receiving notifications following the previous link.
          email_subject: Results published for "%{resource_title}"
          notification_title: The results of the <a href="%{resource_path}">%{resource_title}</a> election are published in <a href="%{participatory_space_url}">%{participatory_space_title}</a>.
    open_data:
      help:
        # One line per top-level key of `ElectionResultsSerializer`, which is
        # what `Decidim::OpenDataExporter` turns into the README inside
        # `open-data.zip`. A key with no line here is published to the world as
        # "translation missing".
        election_results:
          component: The unique id of the component the election belongs to
          description: The description of the election
          end_time: The date and time when voting stops
          id: The unique id of the election
          participatory_space: The space the election belongs to, and its URL
          published_at: The date and time when the election was published
          questions: Every question, its options and its tally, keyed by position
          reference: The unique reference of the election
          results: The tally as a whole - when it was last read, whether it is final, the census size, the votes cast and the turnout
          start_time: The date and time when voting starts
          status: The state of the election
          title: The title of the election
          url: The URL of the election
          verification: The identifiers needed to check this election against the Vocdoni network
    statistics:
      elections_count: Elections
      elections_count_tooltip: The number of published elections.
      votes_count: Votes
      votes_count_tooltip: The number of votes cast across every published election.
    resources:
      election:
        actions:
          vote: Vote
    forms:
      errors:
        # Client-side messages. `FormBuilder#abide_error_element` looks these
        # up per model and attribute and falls back to Decidim's generic
        # "There is an error in this field." — the one sentence on these
        # screens that names neither the field nor the fix.
        census_verifications:
          authorization_handler: Choose the verification to import from. Everybody who has been granted it joins the census.
        election:
          end_time: Enter when voting stops. It has to be a date and time in the future.
          start_time: Enter when voting starts. It has to be a date and time in the future.
    secure_elections:
      admin:
        autosave:
          locked: This step can no longer be edited. Reload the page to see where the election stands.
          on_chain: This election is now on the blockchain, so it can no longer be edited. Reload the page to see it as published.
        calendar:
          edit:
            card_title: Voting period
            title: Schedule
          # Needed wherever a start time is *displayed* rather than set.
          manual_start: Starts when published
          # The same election once it is on the blockchain. "Starts when
          # published" past that point reads as "nothing has happened yet",
          # which is the opposite of the truth.
          started_on_publication: Started when published on the blockchain
          update:
            invalid: There was a problem saving the schedule.
            success: Schedule saved successfully.
        census:
          auth_only: No second factor
          edit:
            title: Census
            warning_body: An election with no authentication field identifies nobody and cannot be published. Choose the member fields voters will be asked for, and the member group they must belong to.
