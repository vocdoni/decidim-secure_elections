              body: Nothing has been written to the blockchain for this election, so nothing is lost there. It is removed from this list and from the public site. Choose OK to move it to the trash — you can bring it back from "View deleted elections" — or Cancel to keep it here.
              title: Move this election to the trash?
            on_chain:
              body: 'This election is on the blockchain and moving it to the trash does not remove it from there: the process, its questions and its results stay public on Vocdoni for ever. What goes is the Decidim side of it — participants can no longer reach the election page. Choose OK to move it to the trash — you can bring it back from "View deleted elections" — or Cancel to keep it here.'
              title: Move this election to the trash?
            voting_open:
              body: 'Voting is open on the blockchain and this does not stop it: votes will keep being accepted and counted, and the result will stand. What it removes is the Decidim page participants use to open their ballot, so anyone who has not voted yet loses their way in. To stop the vote itself, end or cancel the election on the monitoring page first. Choose OK to move it to the trash anyway — you can bring it back from "View deleted elections" — or Cancel to leave it running.'
              title: This election is open and taking votes
          confirm_hide: Are you sure you want to hide this election from the public site? Participants lose the page they use to open their ballot, and if it is already running on the blockchain it will keep accepting votes.
          create:
            invalid: There was a problem creating the election.
            success: Election created successfully.
