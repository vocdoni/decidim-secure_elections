                count:
                  one: "Ara mateix hi ha 1 participant al cens."
                  other: "Ara mateix hi ha %{count} participants al cens."
                late_joiners: "Decidim avala cada participant quan obre la cabina de votació, així que els qui entrin al cens després que comenci la votació (per exemple, perquè es verifiquen més tard) també podran votar, mentre no s'arribi al màxim de votants declarat."
                declared:
                  one: "Màxim declarat: 1 votant."
                  other: "Màxim declarat: %{count} votants."
