                    tamper: "Qualsevol manipulació és detectable: cada votant rep un rebut per comprovar-ho en un explorador públic, i l'exportació de resultats hi fa referència."
                    minimal: "Només s'utilitzen les dades necessàries per verificar qui pot votar; les paperetes no contenen cap dada personal."
                    locked: "Bloquejada un cop publicada — és el que la fa fiable."
                  best_for: "Eleccions de càrrecs, votacions estatutàries, pressupostos — qualsevol cosa que hagi de resistir un impugnament."
                  powered_by: "Impulsat pel protocol de votació Vocdoni."
                  guide_url: ""
                  guide_link: "Llegeix la guia completa"
                good_to_know_html: "<strong>Bon a saber:</strong> pots canviar aquesta tria fins que l'elecció estigui publicada. Les persones votants no notaran cap diferència, excepte el codi d'un sol ús si l'actives."
              two_factor:
                legend: "Confirma la identitat dels votants amb un codi d'un sol ús"
                lead: "Cada votant rep un codi d'un sol ús quan obre la papereta i l'ha d'introduir abans de votar. Evita que algú voti en nom d'una altra persona i fa el resultat més difícil d'impugnar."
                email:
                  label: "Codi per correu electrònic"
                  help: "El codi s'envia a l'adreça de correu electrònic amb la qual cada participant s'ha registrat."
                sms:
                  label: "Codi per SMS"
                  help: "El codi s'envia per missatge de text, de manera que cada votant necessita un número de telèfon registrat al servei de votació."
                both_note: "Si totes dues opcions estan activades, cada votant tria com rebre el codi."
              summary:
                sentences:
