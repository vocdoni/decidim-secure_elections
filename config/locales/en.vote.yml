              already_voted: You had already voted in this election. These are the receipts for the votes we found.
              body: Each receipt below proves a vote was recorded on the voting network. It does not reveal what you voted.
              copied: Receipt code copied to your clipboard.
              copy: Copy
              copy_label: "Copy the receipt code for %{question}"
              copy_manual: The receipt code is selected, ready for you to copy.
              empty: We could not find any vote recorded for you in this election.
              exit: Back to the election
              nullifier_label: Receipt code
              open: Check my receipt
              recorded_title: Your vote was recorded
              return_note: You can see these receipts again at any time by coming back to this election and identifying yourself.
              title: Your vote receipt
            review:
              back: Change my answers
              body: Nothing has been sent yet. Check your answers and cast your vote when you are ready.
              body_partial: The answers below have not been sent yet. Check them and cast your vote when you are ready.
              cast: Cast my vote
              edit: Change
              edit_label: "Change my answer to %{question}"
              not_answered: Not answered
              title: Review your ballot
            status:
              authenticating: Checking your details…
              casting: "Casting your vote for %{question}…"
              checking: Checking what you can vote on…
              confirming: Waiting for the voting network to confirm…
              done: Done.
              loading: Loading the election…
              preparing: Preparing the ballot…
              relaying: Sending your vote…
              sending_code: Sending you a new code…
              signing: Signing your vote…
              waiting_keys: Waiting for the encryption keys to be published…
            submit:
              confirmed_missing: Not recorded. You can try again.
              done: Recorded
              failed: Not recorded
              in_flight: Sending your vote. This can take a few seconds per question — please keep this page open.
              in_progress: Sending…
              pending: Waiting
              recheck: Check whether my vote was recorded
              rechecking: Asking the voting network…
              retry: Try the failed questions again
              summary_failed: Some of your votes could not be cast. Nothing was recorded for them, so you can safely try again.
              summary_unconfirmed: We lost contact while sending some of your votes. They may still have been recorded — check before trying again, so you do not send them twice.
              title: Casting your vote
              unconfirmed: Not confirmed
            theme:
              label: Dark theme
            unavailable: This page could not start. Please reload it, and contact the organisers if it keeps happening.
            validation:
              max_choices: "Pick at most %{max} options."
              min_choices: "Pick at least %{min} options."
              required: Pick one option to continue.
          errors:
            not_on_chain: This election has not been published to the voting network yet, so there is no ballot to open.
