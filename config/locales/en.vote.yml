        votes:
          page:
            auth:
              body: To open your ballot we need to check that you are on the census for this election. These details are sent to the voting network, never stored by this website.
              channel:
                email: Email
                phone: Text message
              channel_legend: How should we send it?
              channel_required: Choose where you want your code sent.
              contact:
                email: Email address
                phone: Mobile number
              legend: Census details
              privacy_note: Your identity is used only to prove you may vote. It is never linked to your ballot.
              required: Please fill in every field before continuing.
              submit: Continue
              title: Identify yourself
              twofa_help:
                email: Use the email address the organisers of this election hold for you — contact them if you are not sure which one that is. We only use it to send your code.
                phone: Use the mobile number the organisers of this election hold for you — contact them if you are not sure which one that is. We only use it to send your code.
              twofa_legend: Where should we send your code?
            ballot:
              already_recorded:
                body: You are only being asked the questions you have left. The receipts for the votes already recorded are shown with the rest at the end.
                list_label: "Already recorded:"
                title: Part of your ballot is already recorded
              back: Previous question
              counter: "Question %{current} of %{total}"
              next: Next
              pick_many: "Pick between %{min} and %{max} options."
              pick_one: Pick one option.
              review: Review my ballot
              secret: Your answer to this question stays encrypted until the election ends.
              title: "Ballot for %{title}"
            blocked:
              already_voted:
                body: You have already voted in this election. Each person can vote once, so there is nothing left for you to cast.
                title: You have already voted
              back: Back to the election
              not_in_census:
                body: The details you entered are not on the census for this election. Check them and try again, or contact the organisers if you believe you should be able to vote.
                title: You are not on the census for this election
              not_open:
                body: There is no question open for you to vote on right now. Voting may not have started yet, or it may already have closed.
                title: Voting is not open
            cancel: Cancel
            closed_notice: Voting is not open for this election right now. You can still identify yourself to check the receipt for a vote you have already cast.
            error:
              retry: Try again
              title: Something went wrong
            errors:
              auth_cooldown: "Too many attempts. Please wait %{seconds} seconds and try again."
              auth_rejected: We could not verify those details. Check them and try again.
              ballot_unsupported: This question uses a ballot format this page does not understand. Please contact the organisers.
              keys_unavailable: This question is encrypted until the end and its encryption keys are not published yet. Your vote was not cast — please try again in a few minutes.
              network: We could not reach the voting network. Check your connection and try again.
              otp_expired: That code is no longer usable. Please identify yourself again to get a new one.
              otp_rejected: That code does not match. Check it and enter it again, or ask for a new one.
              otp_resend_failed: We could not send you a new code. Please wait a moment and try again.
              process_unavailable: This election could not be loaded from the voting network right now.
              relay_rejected: The voting network rejected this vote. It has not been counted.
              relay_unconfirmed: We lost contact while your vote was being sent. It may still have been counted — do not vote again until you have checked.
              sign_rejected: The census would not authorise this vote. It may already have been cast from another device.
              unknown: Something unexpected went wrong. Your vote was not cast.
            exit: Back to the election
            loading:
              body: We are reading this election from the voting network.
              title: Preparing your ballot
            noscript: Your ballot is encrypted and signed in your browser, so this page needs JavaScript to work. Please enable JavaScript and reload it.
            otp:
              body_email: We have emailed you a one-time code. Enter it below to confirm it is you.
              body_phone: We have sent you a one-time code by text message. Enter it below to confirm it is you.
              hint: You can paste the code straight from the message.
              label: One-time code
              required: Enter the code we sent you.
              resend: Send me a new code
              resend_ready: You can now ask for a new code.
              resend_wait: "You can ask for a new code in %{seconds} seconds."
              resent: A new code is on its way.
              restart: Start again
              restart_body: Used the wrong address or number?
              submit: Confirm
              title: Confirm the code we sent you
            page_title: Vote
            progress:
              auth: Identify
              ballot: Choose
              label: Voting steps
              receipt: Receipt
              review: Review
