ca:
  decidim:
    elections:
      vocdoni:
        booth:
          not_ready: "Aquesta elecció encara no està a punt per acceptar vots a la xarxa. Torna-ho a provar d'aquí a uns instants."
          # Shown instead of the booth when this Decidim cannot run the `vocdoni` voting backend.
          unavailable: "La votació d'aquesta elecció no està disponible en aquesta plataforma. Posa't en contacte amb l'organització."
          per_question:
            closed: La votació d'aquesta pregunta s'ha tancat.
            not_open: Aquesta pregunta encara no està oberta a la xarxa de votació. Torna-ho a provar d'aquí a uns moments.
            opening: Obrint la pregunta a la xarxa de votació…
            waiting: Esperant que l'organització obri la pregunta següent. Aquesta pàgina s'actualitzarà sola.
          no_contact:
            email: No tenim cap adreça de correu electrònic teva, així que no et podem enviar el codi d'un sol ús. Posa't en contacte amb l'organització.
            phone: No tenim cap número de mòbil vàlid teu, escrit amb el seu prefix internacional (per exemple, +34 600 123 456), així que no et podem enviar el codi d'un sol ús per SMS. Posa't en contacte amb l'organització.
          receipt:
            final: Aquest vot no es pot modificar.
            check_attestation: Quan acabi la votació podràs comprovar en quines preguntes s'ha signat una papereta al teu nom.
            check_attestation_link: Comprova les meves signatures
        attestations:
          show:
            title: Signatures emeses al teu nom
            pending: La votació encara no ha acabat. Torna quan acabi per comprovar en quines preguntes s'ha signat una papereta al teu nom.
            none: No s'ha signat cap papereta al teu nom.
            signed: "S'ha signat una papereta al teu nom en aquestes preguntes:"
            voted: hi consta un vot
            not_voted: no hi consta cap vot
            explain: Si s'ha signat una papereta al teu nom en una pregunta on no has votat, avisa l'organització.
            unavailable: Ara mateix no es poden comprovar les signatures. Torna-ho a provar més tard.
