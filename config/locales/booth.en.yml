en:
  decidim:
    elections:
      vocdoni:
        booth:
          not_ready: "This election is not yet ready to accept votes on the blockchain. Please try again in a few moments."
          # Shown instead of the booth when this Decidim cannot run the `vocdoni` voting backend.
          unavailable: "Voting on this election is not available on this platform. Please contact the organisers."
          per_question:
            closed: Voting on this question has closed.
            not_open: This question is not open on the voting network yet. Please try again in a few moments.
            opening: Opening the question on the voting network…
            waiting: Waiting for the organisers to open the next question. This page will update by itself.
          # Shown when Decidim cannot attest the voter: it has no contact of the kind the code goes to.
          no_contact:
            email: We do not have an email address for you, so we cannot send you the one-time code. Please contact the organisers.
            phone: We do not have a valid mobile phone number for you, written with its country code (for example +34 600 123 456), so we cannot send you the one-time code by SMS. Please contact the organisers.
          receipt:
            final: This vote cannot be changed.
            check_attestation: After the election ends you can check on which questions a ballot was signed in your name.
            check_attestation_link: Check my signatures
        attestations:
          show:
            title: Signatures issued in your name
            pending: The election has not ended yet. Come back after it ends to check on which questions a ballot was signed in your name.
            none: No ballot was signed in your name.
            signed: "A ballot was signed in your name on these questions:"
            voted: a vote is recorded
            not_voted: no vote is recorded
            explain: If a ballot was signed in your name on a question you did not vote on, please tell the organizers.
            unavailable: The signatures cannot be checked right now. Please try again later.
