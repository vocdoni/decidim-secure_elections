---

base_locale: en
locales: [en, ca, es]

# `data.read` names the English source files `i18n-tasks` checks: the Security
# tab strings and the booth strings under `votes.page`, among others.
data:
  read:
    - config/locales/security.%{locale}.yml
    - config/locales/%{locale}.vote.yml
    - config/locales/explorer.%{locale}.yml
    - config/locales/question_status.%{locale}.yml
  write:
    - config/locales/security.%{locale}.yml

search:
  paths:
    - app/
    - lib/
  # The copy of upstream's Dashboard view uses upstream's keys, relative to
  # upstream's path; they are upstream's to keep.
  exclude:
    - app/views/overrides

ignore_unused:
  # Handed to the booth adapter whole by `VotingBackend.booth_i18n` and read by
  # JavaScript, so most keys have no Ruby reference.
  - decidim.elections.vocdoni.votes.page.*

ignore_missing:
  - decidim.participatory_processes.scopes.global
  # Upstream decidim-elections keys, reused so the Security tab reads like
  # its sibling tabs.
  - decidim.elections.admin.elections.edit.title
  - decidim.elections.admin.elections.form.save
